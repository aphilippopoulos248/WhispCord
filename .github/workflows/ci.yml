name: CI

# Runs on pull requests and feature branches. Pushes to main run it via publish.yml (workflow_call)
# so it doesn't run twice.
on:
  pull_request:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "v*"
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: TypeScript (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build orchestrator and web
        run: npm run build
        env:
          # Placeholders: the build needs the variables to exist, not real values.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  java:
    name: discord-mcp fork (Java build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: mvn -B -q package
