name: Publish Docker Images

# Whispcord fork: publishes to GitHub Container Registry (ghcr.io) under this repo's owner,
# using the built-in GITHUB_TOKEN, so no registry secrets are needed. (Upstream published
# saseq/discord-mcp to Docker Hub.)
#   ghcr.io/<owner>/whispcord-discord-mcp
#   ghcr.io/<owner>/whispcord-orchestrator
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version without v prefix (example: 1.1.0)"
        required: true
        type: string
      push_latest:
        description: "Also update latest tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ci:
    # Never publish an image that fails tests.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: whispcord-discord-mcp
            dockerfile: Dockerfile
          - image: whispcord-orchestrator
            dockerfile: apps/orchestrator/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tags
        id: resolve_tags
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.release_version }}
          DISPATCH_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          set -euo pipefail

          # GHCR image names must be lowercase.
          echo "image=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

          tags=()

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF" == "refs/heads/main" ]]; then
              tags+=("latest")
            elif [[ "$REF" == refs/tags/v* ]]; then
              version="${REF_NAME#v}"
              tags+=("${version}")
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$DISPATCH_VERSION" ]]; then
              echo "release_version is required for workflow_dispatch"
              exit 1
            fi

            if [[ ! "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "release_version must match X.Y.Z or X.Y.Z-suffix"
              exit 1
            fi

            tags+=("$DISPATCH_VERSION")

            if [[ "$DISPATCH_PUSH_LATEST" == "true" ]]; then
              tags+=("latest")
            fi
          fi

          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo "No docker tags resolved for this event"
            exit 1
          fi

          {
            echo "tags<<EOF"
            for tag in "${tags[@]}"; do
              echo "type=raw,value=${tag}"
            done
            echo "type=sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve_tags.outputs.image }}
          tags: ${{ steps.resolve_tags.outputs.tags }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
